# tmux config - keybindings left at their defaults (prefix is Ctrl+b) so the
# muscle memory still works on machines without this config.

# --- Behaviour ---------------------------------------------------------------

# True colour, so Catppuccin and Starship look right inside tmux
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,ghostty:RGB"

# Mouse: click panes/windows, drag borders, scroll with the trackpad
set -g mouse on

# Windows and panes count from 1 (0 is a long reach), and renumber when one closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Name windows after the current folder, and stop programs renaming them
# (shell integration otherwise sets the window name to the hostname)
set -g allow-rename off
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"

# Keep plenty of scrollback
set -g history-limit 100000

# No delay after pressing Escape (matters in vim/nvim)
set -sg escape-time 10

# Longer status message display, and refresh the status bar more often
set -g display-time 2000
set -g status-interval 5

# Open new windows/panes in the current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Shift+Up/Down scrolls 5 lines, like Cmd+Shift+Up/Down in Ghostty.
# Additive: the stock Ctrl+b [ / PageUp keys still work, here and on machines
# without this config.
bind -n S-Up if-shell -F '#{alternate_on}' 'send-keys S-Up' 'copy-mode -e ; send-keys -X -N 5 scroll-up'
bind -n S-Down if-shell -F '#{alternate_on}' 'send-keys S-Down' 'send-keys -X -N 5 scroll-down'

# vi-style keys in copy mode: C-u/C-d half page, g/G top/bottom, / to search
setw -g mode-keys vi

# --- Catppuccin Mocha theme --------------------------------------------------
# Plugins are managed by tpm. On a new machine:
#   git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
# then start tmux and press prefix + I to install them.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
# Show the window name (#W) rather than the pane title (#T, which shell
# integration sets to the hostname)
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Status line: window list on the left, app + session + clock on the right
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Keep this at the very bottom: tpm loads the plugins listed above
run '~/.config/tmux/plugins/tpm/tpm'
