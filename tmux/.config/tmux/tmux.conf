# tmux config - keybindings left at their defaults (prefix is Ctrl+b) so the
# muscle memory still works on machines without this config.

# --- Behaviour ---------------------------------------------------------------

# True colour, so Catppuccin and Starship look right inside tmux
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,ghostty:RGB"

# Mouse: click panes/windows, drag borders, scroll with the trackpad
set -g mouse on

# Windows and panes count from 1 (0 is a long reach), and renumber when one closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep plenty of scrollback
set -g history-limit 100000

# No delay after pressing Escape (matters in vim/nvim)
set -sg escape-time 10

# Longer status message display, and refresh the status bar more often
set -g display-time 2000
set -g status-interval 5

# Open new windows/panes in the current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Shift+Up/Down scrolls 5 lines, like Cmd+Shift+Up/Down in Ghostty.
# Additive: the stock Ctrl+b [ / PageUp keys still work, here and on machines
# without this config.
bind -n S-Up if-shell -F '#{alternate_on}' 'send-keys S-Up' 'copy-mode -e ; send-keys -X -N 5 scroll-up'
bind -n S-Down if-shell -F '#{alternate_on}' 'send-keys S-Down' 'send-keys -X -N 5 scroll-down'

# vi-style keys in copy mode: C-u/C-d half page, g/G top/bottom, / to search
setw -g mode-keys vi

# --- Catppuccin Mocha status bar ---------------------------------------------
# Colours: base #1e1e2e, surface0 #313244, text #cdd6f4, mauve #cba6f7,
# blue #89b4fa, overlay0 #6c7086

set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left: session name
set -g status-left "#[bg=#cba6f7,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#cba6f7]"
set -g status-left-length 30

# Right: host and time
set -g status-right "#[fg=#6c7086] #h #[fg=#89b4fa]%H:%M "
set -g status-right-length 40

# Windows: current one highlighted in blue
setw -g window-status-format "#[fg=#6c7086] #I #W "
setw -g window-status-current-format "#[bg=#89b4fa,fg=#1e1e2e,bold] #I #W "

# Pane borders: the active pane's border is mauve
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# Message/command line
set -g message-style "bg=#313244,fg=#cdd6f4"
